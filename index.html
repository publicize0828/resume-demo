<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数字人续播 Demo · SDK 打断与续播解决方案</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="board">
    <!-- ====== 顶栏 ====== -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>数字人续播 Demo · 打断与续播</h1>
          <p>XmovAvatar · SSML 自定义事件 · 业务系统维护进度</p>
        </div>
      </div>

      <div class="cred-group">
        <span class="cred-label">应用凭据</span>
        <div class="cred-field">
          <label class="cred-name" for="appIdInput">AppId</label>
          <input class="cred-input" id="appIdInput" type="text" spellcheck="false" autocomplete="off" placeholder="请输入 AppId">
        </div>
        <div class="cred-field">
          <label class="cred-name" for="appSecretInput">Secret</label>
          <span class="secret-wrap">
            <input class="cred-input" id="appSecretInput" type="password" spellcheck="false" autocomplete="off" placeholder="请输入 AppSecret">
            <button class="secret-toggle" id="secretToggle" type="button" aria-label="显示 AppSecret">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </span>
        </div>
      </div>

      <div class="top-right">
        <div class="mini-progress">
          <span id="progressText">0/16</span>
          <div class="mini-track"><div class="mini-bar" id="miniBar"></div></div>
        </div>
        <div class="status-chip" id="statusChip" data-state="idle">
          <span class="dot"></span><span id="statusText">未初始化</span>
        </div>
      </div>
    </header>

    <!-- ====== 三栏主体 ====== -->
    <main class="main">
      <!-- 左：数字人 -->
      <section class="left-panel" id="avatarScene">
        <div class="left-head">
          <span class="ai-name">AI 数字人</span>
          <span class="sdk-badge" id="sdkBadge">SDK 未连接</span>
        </div>
        <div class="avatar-wrap">
          <div class="question-pill" id="questionPill">已打断 · 等待继续</div>
          <div id="avatar-container"></div>
          <div id="loading-mask" class="loading-mask">
            <div class="progress-bar-wrap"><div id="progress-bar" class="progress-bar-fill"></div></div>
            <span id="loading-text" class="loading-text">正在连接数字人...</span>
          </div>
        </div>
      </section>

      <!-- 中：字幕 + 进度 + 控制 -->
      <section class="center-panel">
        <div class="speech-bubble">
          <div class="bubble-top">
            <span class="bubble-tag" id="bubbleTag">--</span>
            <span class="anchor-note" id="anchorNote">等待初始化数字人</span>
          </div>
          <p id="speechText">课程内容已就绪</p>
        </div>

        <div class="seg-track" id="segTrack" aria-label="课程句子进度"></div>

        <div class="controls">
          <div class="btn-row">
            <button class="btn primary" id="btnInit">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
              <span>初始化</span>
            </button>
            <button class="btn ghost" id="btnDestroy" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
              <span>销毁</span>
            </button>
          </div>
          <div class="btn-row">
            <button class="btn primary" id="btnStart" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
              <span>开始上课</span>
            </button>
            <button class="btn danger" id="btnInterrupt" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1"></rect></svg>
              <span>打断（提问）</span>
            </button>
            <button class="btn outline" id="btnResume" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 10 20 15 15 20"></polyline><path d="M4 4v7a4 4 0 0 0 4 4h12"></path></svg>
              <span>继续上课（续播）</span>
            </button>
          </div>
        </div>
      </section>

      <!-- 右：句子列表 + 事件日志 -->
      <aside class="right-panel">
        <section class="lesson-panel">
          <div class="panel-head">
            <h3><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg> 课程句子</h3>
            <span class="count-badge">16 句</span>
          </div>
          <div class="sentence-list" id="sentenceList"></div>
        </section>
        <section class="log-panel">
          <div class="panel-head">
            <h3><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg> 回调事件</h3>
            <span class="count-badge" id="logCount">0</span>
          </div>
          <div class="event-log" id="eventLog"></div>
        </section>
      </aside>
    </main>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
    <span id="toastText"></span>
  </div>

  <script src="https://media.xingyun3d.com/xingyun3d/general/litesdk/xmovAvatar@latest.js"></script>
  <script src="core.js"></script>
  <script src="main.js"></script>
</body>
</html>
