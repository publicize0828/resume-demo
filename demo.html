<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数字人续播 Demo · SDK 打断与续播解决方案</title>
  <style>
    :root {
      --bg: #e7ece9;
      --surface: #ffffff;
      --line: #dce5e1;
      --ink: #17231e;
      --muted: #6c7872;
      --primary: #0f766e;
      --primary-dark: #0d6861;
      --accent: #e8624c;
      --warn: #c97b1f;
      --ok: #2f9e77;
      --stage: #123b33;
      --mono: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      display: grid;
      place-items: center;
      padding: 14px;
      overflow: hidden;
    }

    button {
      font-family: inherit;
    }

    .board {
      width: min(1180px, 100%);
      height: min(680px, 100%);
      max-height: calc(100vh - 28px);
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 18px 46px rgba(24, 55, 45, 0.14);
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      min-height: 60px;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      justify-self: start;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .brand-mark svg {
      width: 18px;
      height: 18px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-text p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 0 0 auto;
      justify-self: end;
    }

    .cred-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 5px 10px;
      background: #f4f8f6;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .cred-label {
      font-size: 11px;
      font-weight: 650;
      color: var(--muted);
      white-space: nowrap;
    }

    .cred-field {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .cred-name {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .cred-input {
      width: 164px;
      height: 30px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfdfc;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .cred-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .cred-input::placeholder {
      color: #a6b0ab;
    }

    .cred-input.is-invalid {
      border-color: var(--accent);
      background: #fff8f6;
      box-shadow: 0 0 0 3px rgba(232, 98, 76, 0.14);
    }

    .secret-wrap {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .secret-wrap .cred-input {
      width: 204px;
      padding-right: 30px;
    }

    .secret-toggle {
      position: absolute;
      right: 3px;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .secret-toggle:hover {
      color: var(--ink);
      background: #eef2f0;
    }

    .secret-toggle svg {
      width: 14px;
      height: 14px;
    }

    .mini-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    .mini-track {
      width: 96px;
      height: 6px;
      border-radius: 99px;
      background: #e2e9e5;
      overflow: hidden;
    }

    .mini-bar {
      height: 100%;
      width: 0;
      background: var(--primary);
      transition: width 0.35s ease;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 99px;
      background: #edf3f0;
      border: 1px solid #d5e3de;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    .status-chip .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9aa8a2;
      transition: background 0.25s ease;
    }

    .status-chip[data-state="connecting"] {
      background: #fff7e6;
      border-color: #f2d9ae;
      color: var(--warn);
    }

    .status-chip[data-state="connecting"] .dot {
      background: var(--warn);
      animation: pulse 1s ease-in-out infinite;
    }

    .status-chip[data-state="playing"] {
      background: #e2f1ec;
      border-color: #bcddd3;
    }

    .status-chip[data-state="playing"] .dot {
      background: var(--primary);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .status-chip[data-state="interrupted"] {
      background: #fdeeea;
      border-color: #f4cdc5;
      color: var(--accent);
    }

    .status-chip[data-state="interrupted"] .dot {
      background: var(--accent);
    }

    .status-chip[data-state="finished"] {
      background: #e7f3ec;
      border-color: #bfe2cf;
      color: var(--ok);
    }

    .status-chip[data-state="finished"] .dot {
      background: var(--ok);
    }

    .main {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 330px;
      min-height: 0;
      min-width: 0;
    }

    .left-panel {
      background: var(--stage);
      color: #e9f6f2;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 14px;
      min-height: 0;
      min-width: 0;
      transition: box-shadow 0.3s ease;
    }

    .left-panel.is-speaking {
      box-shadow: inset 0 0 0 2px rgba(94, 208, 178, 0.35);
    }

    .left-panel.is-interrupted {
      box-shadow: inset 0 0 0 2px rgba(232, 98, 76, 0.45);
    }

    .left-panel.is-finished {
      box-shadow: inset 0 0 0 2px rgba(47, 158, 119, 0.4);
    }

    .left-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex: 0 0 auto;
    }

    .ai-name {
      font-size: 13px;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .ai-name::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5ed0b2;
    }

    .sdk-badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #b9d8d0;
      white-space: nowrap;
    }

    .avatar-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      margin-top: 4px;
      background: #0c2b24;
      border-radius: 8px;
      overflow: hidden;
    }

    #avatar-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #avatar-container > * {
      width: 100% !important;
      height: 100% !important;
    }

    .loading-mask {
      position: absolute;
      inset: 0;
      background: rgba(12, 43, 36, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }

    .loading-mask.hidden {
      display: none;
    }

    .loading-text {
      font-size: 13px;
      color: #b9d8d0;
    }

    .progress-bar-wrap {
      width: 60%;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #5ed0b2;
      transition: width 0.3s ease;
    }

    .question-pill {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #fdf0e5;
      color: #a05a17;
      border: 1px solid #f0d3b2;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 3;
    }

    .question-pill.show {
      opacity: 1;
      transform: translateY(0);
    }

    .center-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      min-width: 0;
      min-height: 0;
    }

    .speech-bubble {
      flex: 0 0 auto;
      background: #f4f8f6;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 14px 13px;
      min-height: 96px;
    }

    .bubble-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .bubble-tag {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--primary);
      font-weight: 700;
    }

    .anchor-note {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .speech-bubble p {
      margin: 7px 0 0;
      font-size: 17px;
      line-height: 1.55;
      min-height: 2.4em;
      color: var(--ink);
    }

    .seg-track {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 5px;
      flex: 0 0 auto;
    }

    .seg-cell {
      height: 8px;
      border-radius: 3px;
      background: #e2e9e5;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .seg-cell.is-done {
      background: #3aa98c;
    }

    .seg-cell.is-current {
      background: #f2b35c;
      transform: scaleY(1.6);
      animation: pulse 1.1s ease-in-out infinite;
    }

    .seg-cell.is-break {
      background: #f08a73;
    }

    .controls {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 0 0 auto;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease, transform 0.1s ease;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn svg {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
    }

    .btn.primary {
      background: #1c8f7c;
      color: #fff;
    }

    .btn.primary:not(:disabled):hover {
      background: #17806f;
    }

    .btn.danger {
      background: var(--accent);
      color: #fff;
    }

    .btn.danger:not(:disabled):hover {
      background: #d85843;
    }

    .btn.outline {
      background: #f2f7f5;
      border-color: #b8d0c9;
      color: var(--primary);
    }

    .btn.outline:not(:disabled):hover {
      background: #e7f2ee;
    }

    .btn.ghost {
      background: #fff;
      border-color: #dfe7e3;
      color: var(--muted);
    }

    .btn.ghost:not(:disabled):hover {
      background: #f0f4f2;
      color: var(--ink);
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      min-width: 0;
      min-height: 0;
    }

    .lesson-panel,
    .log-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    .lesson-panel {
      flex: 0 0 42%;
      border-bottom: 1px solid var(--line);
    }

    .log-panel {
      flex: 1 1 auto;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h3 {
      margin: 0;
      font-size: 12px;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .panel-head h3 svg {
      width: 13px;
      height: 13px;
      color: var(--primary);
    }

    .count-badge {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      background: #eff3f1;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 7px;
      white-space: nowrap;
    }

    .sentence-list {
      overflow: auto;
      flex: 1 1 auto;
      min-height: 0;
    }

    .sent-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid #edf1ef;
      transition: background 0.2s ease;
    }

    .sent-row:last-child {
      border-bottom: 0;
    }

    .sent-row.is-current {
      background: #e8f4f0;
      animation: rowGlow 1.4s ease-in-out infinite;
    }

    .sent-row.is-done .sent-text {
      color: #8a958f;
    }

    .sent-row.is-break {
      background: #fdf0ec;
    }

    .seg-badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: #eef2f0;
      color: #54645d;
      flex: 0 0 auto;
      white-space: nowrap;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .sent-row.is-current .seg-badge {
      background: var(--primary);
      color: #fff;
    }

    .sent-row.is-break .seg-badge {
      background: var(--accent);
      color: #fff;
    }

    .sent-main {
      min-width: 0;
      flex: 1 1 auto;
    }

    .sent-text {
      font-size: 12px;
      line-height: 1.45;
      color: var(--ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .sent-state {
      flex: 0 0 auto;
      margin-top: 1px;
      color: #9aa6a0;
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      white-space: nowrap;
    }

    .sent-state svg {
      width: 11px;
      height: 11px;
    }

    .sent-row.is-current .sent-state {
      color: var(--primary);
      font-weight: 600;
    }

    .sent-row.is-break .sent-state {
      color: var(--accent);
      font-weight: 600;
    }

    .sent-row.is-done .sent-state {
      color: var(--ok);
    }

    .event-log {
      flex: 1 1 auto;
      overflow: auto;
      background: #0f1d19;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
      padding: 6px 9px 10px;
      min-height: 0;
    }

    .log-line {
      padding: 5px 3px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 7px;
      align-items: flex-start;
    }

    .log-time {
      color: #6f9188;
      flex: 0 0 auto;
    }

    .log-type {
      flex: 0 0 auto;
      font-weight: 700;
      font-size: 10px;
      color: #f2b35c;
      min-width: 56px;
    }

    .log-type.bus {
      color: #f2b35c;
    }

    .log-type.sdk {
      color: #8fa9c9;
    }

    .log-type.widget {
      color: #8fc8ff;
    }

    .log-type.voice {
      color: #5fd0b0;
    }

    .log-msg {
      color: #c7e7dd;
      word-break: break-word;
    }

    .log-json {
      display: block;
      color: #7fa99d;
      font-size: 10px;
      margin-top: 1px;
      word-break: break-all;
    }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translate(-50%, -10px);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #f1c4b9;
      box-shadow: 0 10px 28px rgba(80, 34, 24, 0.16);
      color: #9c3522;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: var(--accent);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    @keyframes rowGlow {
      0%, 100% { background: #e8f4f0; }
      50% { background: #d9eee7; }
    }

    @media (max-width: 1180px) {
      .topbar {
        display: flex;
        flex-wrap: wrap;
        row-gap: 8px;
        padding: 8px 14px;
      }

      .brand {
        flex: 1 1 100%;
      }

      .cred-group {
        flex: 1 1 auto;
      }

      .top-right {
        flex: 1 1 auto;
        justify-content: flex-end;
      }
    }

    @media (max-width: 1050px) {
      .main {
        grid-template-columns: 260px minmax(0, 1fr) 300px;
      }

      .speech-bubble p {
        font-size: 15px;
      }
    }

    @media (max-width: 880px) {
      body {
        overflow: auto;
        padding: 10px;
        place-items: start center;
      }

      .board {
        height: auto;
        min-height: 0;
        max-height: none;
      }

      .main {
        grid-template-columns: 1fr;
        grid-template-rows: 260px minmax(0, 1fr);
      }

      .left-panel {
        border-bottom: 1px solid var(--line);
      }

      .right-panel {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .lesson-panel {
        flex: 0 0 40%;
      }
    }

    @media (max-width: 560px) {
      .mini-progress {
        display: none;
      }

      .cred-group {
        flex-wrap: wrap;
        width: 100%;
      }

      .cred-field {
        flex: 1 1 100%;
        min-width: 0;
      }

      .secret-wrap {
        flex: 1 1 auto;
        min-width: 0;
      }

      .cred-input,
      .secret-wrap .cred-input {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="board">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>数字人续播 Demo · 打断与续播</h1>
          <p>XmovAvatar · SSML 自定义事件 · 业务系统维护进度</p>
        </div>
      </div>
      <div class="cred-group">
        <span class="cred-label">应用凭据</span>
        <div class="cred-field">
          <label class="cred-name" for="appIdInput">AppId</label>
          <input class="cred-input" id="appIdInput" type="text" spellcheck="false" autocomplete="off" placeholder="请输入 AppId">
        </div>
        <div class="cred-field">
          <label class="cred-name" for="appSecretInput">Secret</label>
          <span class="secret-wrap">
            <input class="cred-input" id="appSecretInput" type="password" spellcheck="false" autocomplete="off" placeholder="请输入 AppSecret">
            <button class="secret-toggle" id="secretToggle" type="button" aria-label="显示 AppSecret" title="显示/隐藏 AppSecret">

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
    <span id="toastText"></span>
  </div>

  <script src="https://media.xingyun3d.com/xingyun3d/general/litesdk/xmovAvatar@latest.js"></script>
  <script>

    const SDK_CONFIG = {
      appId: 'd37919f1ebf34c829f831836ce8149a9',
      appSecret: 'a3631d111a574fc28b270440c89c5eaa',
      gatewayServer: 'https://nebula-agent.xingyun3d.com/user/v1/ttsa/session'
    };

    const AVATAR_CONFIG = {
      layout: {
        container: { size: [1080, 1920] },
        avatar: {
          v_align: 'center',
          h_align: 'middle',
          scale: 0.5,
          offset_x: 140,
          offset_y: 200
        }
      }
    };

    const CREDENTIALS_STORAGE_KEY = "xmovAvatarDemoCredentials";
    const EYE_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const EYE_OFF_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

    function loadCredentials() {
      try {
        const saved = JSON.parse(localStorage.getItem(CREDENTIALS_STORAGE_KEY) || "null");
        if (saved && typeof saved.appId === "string" && typeof saved.appSecret === "string"
            && saved.appId.trim() && saved.appSecret.trim()) {
          return saved;
        }
      } catch (error) {
        console.warn("读取本地凭据失败", error);
      }
      return { appId: SDK_CONFIG.appId, appSecret: SDK_CONFIG.appSecret };
    }

    function saveCredentials() {
      try {
        localStorage.setItem(CREDENTIALS_STORAGE_KEY, JSON.stringify({
          appId: els.appIdInput.value.trim(),
          appSecret: els.appSecretInput.value.trim()
        }));
      } catch (error) {
        console.warn("保存本地凭据失败", error);
      }
    }

    function getCredentialConfig() {
      return {
        appId: els.appIdInput.value.trim(),
        appSecret: els.appSecretInput.value.trim(),
        gatewayServer: SDK_CONFIG.gatewayServer
      };
    }

    let toastTimer = null;

    function showToast(message) {
      els.toastText.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 3200);
    }

    function flagMissingCredentials() {
      [els.appIdInput, els.appSecretInput].forEach((input) => {
        input.classList.toggle("is-invalid", !input.value.trim());
      });
      const firstEmpty = !els.appIdInput.value.trim() ? els.appIdInput : els.appSecretInput;
      firstEmpty.focus();
    }

    

    const COURSE_TEXT =
      "同学们好，今天我们学习一元一次方程的应用。这节课我们来解决一类非常常见的实际问题——行程问题。行程问题主要涉及速度、时间和路程这三个基本量。它们之间的关系是：路程等于速度乘以时间。我们来看一个具体的例子。小明从家出发去学校，家到学校的距离是2400米。小明步行的速度是每分钟80米。那么小明需要多长时间才能到达学校呢？这个问题我们设小明需要x分钟到达学校。根据路程等于速度乘以时间的公式，我们可以列出方程：80x等于2400。解这个方程，两边同时除以80，得到x等于30。所以小明需要30分钟到达学校。同学们，你们理解了这个解题思路吗？接下来我们再来看一个更复杂一点的例子。小华和小红从相距3000米的两地同时相向而行，小华的速度是每分钟100米，小红的速度是每分钟50米，他们多久后相遇？这个问题同样可以用一元一次方程来解决。";

    function buildUserPauseEvent(segId) {
      return `<uievent><type>user_pause</type><data><seg_id>${segId}</seg_id></data></uievent>`;
    }

    const $ = (id) => document.getElementById(id);

    const els = {
      appIdInput: $("appIdInput"),
      appSecretInput: $("appSecretInput"),
      secretToggle: $("secretToggle"),
      statusChip: $("statusChip"),
      statusText: $("statusText"),
      progressText: $("progressText"),
      miniBar: $("miniBar"),
      sdkBadge: $("sdkBadge"),
      avatarScene: $("avatarScene"),
      questionPill: $("questionPill"),
      bubbleTag: $("bubbleTag"),
      anchorNote: $("anchorNote"),
      speechText: $("speechText"),
      segTrack: $("segTrack"),
      sentenceList: $("sentenceList"),
      eventLog: $("eventLog"),
      logCount: $("logCount"),
      loadingMask: $("loading-mask"),
      progressBar: $("progress-bar"),
      loadingText: $("loading-text"),
      toast: $("toast"),
      toastText: $("toastText"),
      btnInit: $("btnInit"),
      btnDestroy: $("btnDestroy"),
      btnStart: $("btnStart"),
      btnInterrupt: $("btnInterrupt"),
      btnResume: $("btnResume")
    };

    const STATUS_MAP = {
      idle: "未开始",
      connecting: "连接中",
      playing: "播报中",
      interrupted: "已打断 · 可续播",
      finished: "课程结束"
    };

    const SDK_BADGE_MAP = {
      idle: "SDK 已就绪",
      connecting: "SDK 连接中",
      playing: "SDK 播报中",
      interrupted: "SDK 已暂停",
      finished: "SDK 播报完成"
    };

    let sdk = null;
    let COURSE = [];
    let sentences = [];
    let currentIndex = 0;
    let state = "idle";
    let isConnected = false;
    let isInitializing = false;
    let isDestroying = false;
    let isPaused = true;
    let isSpeaking = false;
    let isFinished = false;
    let hasStarted = false;
    let waitingForUserPause = false;
    let isResuming = false;
    const doneSet = new Set();

    function splitSentences(text) {
      const parts = text
        .replace(/\s+/g, "")
        .split(/(?<=[。！？!?])/);
      return parts.map((s) => s.trim()).filter(Boolean);
    }

    function prepareCourse() {
      COURSE = splitSentences(COURSE_TEXT).map((text, i) => ({
        id: `seg_${String(i + 1).padStart(3, "0")}`,
        text
      }));
      sentences = COURSE.map((s) => s.text);
    }

    function buildFullSSML(fromIndex = 0) {
      const body = COURSE
        .slice(fromIndex)
        .map((item) => `${item.text}${buildUserPauseEvent(item.id)}`)
        .join("");
      return `<speak>${body}</speak>`;
    }

    function nowTime() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    function log(channel, name, msg, payload) {
      const line = document.createElement("div");
      line.className = "log-line";

      const time = document.createElement("span");
      time.className = "log-time";
      time.textContent = nowTime();

      const badge = document.createElement("span");
      badge.className = "log-type " + channel.toLowerCase();
      badge.textContent = channel.toUpperCase();

      const body = document.createElement("span");
      body.className = "log-msg";
      body.textContent = `${name} · ${msg}`;

      if (payload !== undefined) {
        const json = document.createElement("span");
        json.className = "log-json";
        json.textContent = JSON.stringify(payload);
        body.appendChild(json);
      }

      line.append(time, badge, body);
      els.eventLog.appendChild(line);
      els.logCount.textContent = els.eventLog.children.length;
      els.eventLog.scrollTop = els.eventLog.scrollHeight;
    }

    function setState(next) {
      state = next;
      els.statusChip.dataset.state = next;
      els.statusText.textContent = STATUS_MAP[next];
      if (isConnected) {
        els.sdkBadge.textContent = SDK_BADGE_MAP[next] || "SDK 已就绪";
      }
      els.avatarScene.classList.remove("is-connecting", "is-speaking", "is-interrupted", "is-finished");
      if (next !== "idle") els.avatarScene.classList.add("is-" + next);
    }

    function setCurrent(idx) {
      if (idx < 0) {
        els.bubbleTag.textContent = "--";
        els.speechText.textContent = "课程内容已就绪";
        els.anchorNote.textContent = "等待开始播报";
        return;
      }
      els.bubbleTag.textContent = sentences.length ? COURSE[idx].id : "--";
      els.speechText.textContent = sentences[idx];
      els.anchorNote.textContent = state === "interrupted"
        ? `已保留进度：${COURSE[idx].id}`
        : `正在播报：${COURSE[idx].id}`;

      const row = els.sentenceList.children[idx];
      if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function updateProgress() {
      const count = doneSet.size;
      els.progressText.textContent = `${count}/${sentences.length}`;
      els.miniBar.style.width = `${(count / sentences.length) * 100}%`;

      document.querySelectorAll(".seg-cell").forEach((cell, i) => {
        cell.className = "seg-cell";
        if (doneSet.has(i)) cell.classList.add("is-done");
        if (i === currentIndex && (state === "playing" || state === "interrupted")) cell.classList.add("is-current");
        if (i === currentIndex && state === "interrupted") cell.classList.add("is-break");
      });
    }

    function renderList() {
      Array.from(els.sentenceList.children).forEach((row, i) => {
        row.className = "sent-row";
        if (doneSet.has(i)) row.classList.add("is-done");
        if (i === currentIndex && (state === "playing" || state === "interrupted")) row.classList.add("is-current");
        if (i === currentIndex && state === "interrupted") row.classList.add("is-break");

        const stateEl = row.querySelector(".sent-state");
        if (i === currentIndex && state === "interrupted") {
          stateEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>打断点`;
        } else if (i === currentIndex && state === "playing") {
          stateEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>播报中`;
        } else if (doneSet.has(i)) {
          stateEl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>已播报`;
        } else {
          stateEl.textContent = "待播报";
        }
      });
    }

    function buildList() {
      const fragment = document.createDocumentFragment();
      COURSE.forEach((s, i) => {
        const row = document.createElement("div");
        row.className = "sent-row";

        const badge = document.createElement("span");
        badge.className = "seg-badge";
        badge.textContent = s.id;

        const main = document.createElement("div");
        main.className = "sent-main";

        const text = document.createElement("div");
        text.className = "sent-text";
        text.textContent = s.text;

        const stateEl = document.createElement("span");
        stateEl.className = "sent-state";
        stateEl.textContent = "待播报";

        main.append(text, stateEl);
        row.append(badge, main);
        fragment.appendChild(row);
      });
      els.sentenceList.appendChild(fragment);
    }

    function buildProgress() {
      const fragment = document.createDocumentFragment();
      COURSE.forEach((s) => {
        const cell = document.createElement("div");
        cell.className = "seg-cell";
        cell.title = s.id;
        fragment.appendChild(cell);
      });
      els.segTrack.appendChild(fragment);
    }

    function updateButtons() {
      els.btnInit.disabled = isConnected || isInitializing || isDestroying;
      els.btnDestroy.disabled = !isConnected || isDestroying;
      els.btnStart.disabled = !isConnected || state === "playing";
      els.btnInterrupt.disabled = state !== "playing";
      els.btnResume.disabled = state !== "interrupted" || isResuming;
    }

    function resetBroadcastState() {
      doneSet.clear();
      currentIndex = 0;
      isPaused = true;
      isSpeaking = false;
      isFinished = false;
      hasStarted = false;
      waitingForUserPause = false;
      setCurrent(-1);
      els.questionPill.classList.remove("show");
      renderList();
      updateProgress();
    }

    function showLoading(text) {
      els.loadingText.textContent = text || "正在连接数字人...";
      els.progressBar.style.width = "0%";
      els.loadingMask.classList.remove("hidden");
    }

    function hideLoading() {
      els.loadingMask.classList.add("hidden");
    }

    function resolveUserPauseIndex(payload) {
      if (!payload || typeof payload.seg_id !== "string") return -1;
      return COURSE.findIndex((s) => s.id === payload.seg_id);
    }

    function handleUserPause(payload) {
      if (!hasStarted || isPaused || isFinished || !waitingForUserPause) return;

      const completedIndex = resolveUserPauseIndex(payload);
      if (completedIndex !== currentIndex) {
        if (completedIndex >= 0) {
          log("BUS", "回调忽略", `seg_id 不是当前句，忽略：${payload.seg_id}`);
        } else {
          log("BUS", "回调无效", "seg_id 缺失或无法解析，忽略本次回调", payload ?? null);
        }
        return;
      }

      if (completedIndex >= sentences.length - 1) {
        doneSet.add(completedIndex);
        waitingForUserPause = false;
        isFinished = true;
        setState("finished");
        els.questionPill.classList.remove("show");
        els.bubbleTag.textContent = "完成";
        els.speechText.textContent = "本节课到此结束";
        els.anchorNote.textContent = "全部句子已播报完成";
        renderList();
        updateProgress();
        updateButtons();
        log("BUS", "课程结束", "全部句子播报完成", { played: doneSet.size });
        return;
      }

      doneSet.add(completedIndex);
      currentIndex = completedIndex + 1;
      setCurrent(currentIndex);
      renderList();
      updateProgress();
    }

    function startClass() {
      if (!sdk || !isConnected || state === "playing") return;

      resetBroadcastState();
      hasStarted = true;
      isPaused = false;
      waitingForUserPause = true;
      setState("playing");
      setCurrent(0);
      renderList();
      updateProgress();
      updateButtons();
      log("BUS", "开始上课", "下发完整句子列表", { total: sentences.length });
      sdk.speak(buildFullSSML(0), true, true);
    }

    function interrupt() {
      if (state !== "playing" || !sdk) return;

      try {
        sdk.interactiveidle();
      } catch (error) {
        console.error(error);
        log("BUS", "interrupt 失败", "中断指令调用失败，保持播报中");
        return;
      }

      isPaused = true;
      isSpeaking = false;
      waitingForUserPause = false;
      setState("interrupted");
      els.questionPill.classList.add("show");
      setCurrent(currentIndex);
      renderList();
      updateProgress();
      updateButtons();
      log("BUS", "interrupt()", `保留当前句 ${COURSE[currentIndex].id} 为续播起点`, {
        progress: currentIndex,
        sentenceId: COURSE[currentIndex].id
      });
    }

    async function resume() {
      if (state !== "interrupted" || !sdk || !isConnected || isResuming) return;

      isResuming = true;
      updateButtons();

      try {
        try {
          sdk.interactiveidle();
        } catch (error) {
          console.error(error);
        }
        await new Promise((r) => setTimeout(r, 300));

        if (!sdk || !isConnected || state !== "interrupted") return;

        isPaused = false;
        isFinished = false;
        waitingForUserPause = true;
        hasStarted = true;
        setState("playing");
        els.questionPill.classList.remove("show");
        setCurrent(currentIndex);
        renderList();
        updateProgress();
        updateButtons();
        log("BUS", "续播", `从 ${COURSE[currentIndex].id} 重播当前句并继续`, {
          from: COURSE[currentIndex].id
        });
        sdk.speak(buildFullSSML(currentIndex), true, true);
      } catch (error) {
        console.error(error);
        isPaused = true;
        waitingForUserPause = false;
        setState("interrupted");
        els.questionPill.classList.add("show");
        setCurrent(currentIndex);
        renderList();
        updateProgress();
        log("BUS", "续播失败", "播报下发失败，已恢复到已打断状态", {
          sentenceId: COURSE[currentIndex] ? COURSE[currentIndex].id : null
        });
      } finally {
        isResuming = false;
        updateButtons();
      }
    }

    function handleWidgetEvent(data) {
      if (["subtitle_on", "subtitle_off", "user_pause", "voice_start", "voice_end"].includes(data.type)) {
        log("WIDGET", data.type, "收到数字人回调事件", data);
      }
      if (data.type === "user_pause") {
        handleUserPause(data.data);
      }
    }

    function handleVoiceState(stateName) {
      log("VOICE", stateName, stateName === "voice_start" ? "数字人开始发声" : "数字人结束发声");
      if (stateName === "voice_start") {
        isSpeaking = true;
      }
      if (stateName === "voice_end") {
        isSpeaking = false;
        if (hasStarted && !isPaused && !isFinished) {
          for (let i = Math.max(0, currentIndex); i < sentences.length; i++) {
            doneSet.add(i);
          }
          currentIndex = sentences.length;
          isFinished = true;
          waitingForUserPause = false;
          setState("finished");
          els.questionPill.classList.remove("show");
          els.bubbleTag.textContent = "完成";
          els.speechText.textContent = "本节课到此结束";
          els.anchorNote.textContent = "全部句子已播报完成";
          renderList();
          updateProgress();
          updateButtons();
          log("BUS", "课程结束", "数字人 voice_end 兜底结束", { played: doneSet.size });
        }
      }
    }

    async function initSDK() {
      if (isConnected || isInitializing || isDestroying) return;

      if (!window.XmovAvatar) {
        setState("idle");
        els.statusText.textContent = "SDK 脚本未加载";
        log("BUS", "init 失败", "未检测到 window.XmovAvatar，请检查网络后刷新");
        return;
      }

      const config = getCredentialConfig();
      if (!config.appId || !config.appSecret) {
        setState("idle");
        els.statusText.textContent = "请填写 AppId 和 AppSecret";
        log("BUS", "init 失败", "AppId 或 AppSecret 为空");
        showToast("请先填写 AppId 和 AppSecret");
        flagMissingCredentials();
        return;
      }

      isInitializing = true;
      setState("connecting");
      showLoading("正在连接数字人...");
      updateButtons();
      log("SDK", "init", "开始初始化 XmovAvatar", config);

      try {
        sdk = new XmovAvatar({
          containerId: "#avatar-container",
          appId: config.appId,
          appSecret: config.appSecret,
          gatewayServer: config.gatewayServer,
          config: AVATAR_CONFIG,
          enableClientInterrupt: true,
          onWidgetEvent: handleWidgetEvent,
          onVoiceStateChange: handleVoiceState,
          onMessage: (msg) => log("SDK", "message", "收到 SDK 消息", msg)
        });

        await sdk.init({
          onDownloadProgress: (progress) => {
            els.progressBar.style.width = `${progress}%`;
            els.loadingText.textContent = `正在加载资源 ${progress}%`;
          }
        });
        await sdk.start();

        isConnected = true;
        hideLoading();
        setState("idle");
        els.statusText.textContent = "点击开始上课";
        log("SDK", "connected", "数字人初始化完成");
      } catch (error) {
        console.error(error);
        hideLoading();
        setState("idle");
        els.statusText.textContent = "初始化失败，请重试";
        log("SDK", "init error", error.message || String(error));
        if (sdk) {
          try {
            await sdk.destroy();
          } catch (_) { /* ignore */ }
          sdk = null;
        }
      } finally {
        isInitializing = false;
        updateButtons();
      }
    }

    async function destroySDK() {
      if (!sdk || isDestroying) return;
      isDestroying = true;
      updateButtons();

      try {
        await sdk.stop();
        await sdk.destroy();
        log("SDK", "destroyed", "数字人已销毁");
      } catch (error) {
        console.error(error);
        log("SDK", "destroy error", error.message || String(error));
      } finally {
        sdk = null;
        isConnected = false;
        isDestroying = false;
        hideLoading();
        resetBroadcastState();
        setState("idle");
        els.statusText.textContent = "未初始化";
        els.sdkBadge.textContent = "SDK 未连接";
        updateButtons();
      }
    }

    function initEventListeners() {
      els.btnInit.addEventListener("click", initSDK);
      els.btnDestroy.addEventListener("click", destroySDK);
      els.btnStart.addEventListener("click", startClass);
      els.btnInterrupt.addEventListener("click", interrupt);
      els.btnResume.addEventListener("click", resume);

      els.appIdInput.addEventListener("input", () => {
        els.appIdInput.classList.remove("is-invalid");
        saveCredentials();
        updateButtons();
      });
      els.appSecretInput.addEventListener("input", () => {
        els.appSecretInput.classList.remove("is-invalid");
        saveCredentials();
        updateButtons();
      });
      els.secretToggle.addEventListener("click", () => {
        const show = els.appSecretInput.type === "password";
        els.appSecretInput.type = show ? "text" : "password";
        els.secretToggle.innerHTML = show ? EYE_OFF_ICON : EYE_ICON;
        els.secretToggle.setAttribute("aria-label", show ? "隐藏 AppSecret" : "显示 AppSecret");
      });

      window.addEventListener("pagehide", () => void destroySDK());
      window.addEventListener("beforeunload", () => void destroySDK());
    }

    document.addEventListener("DOMContentLoaded", () => {
      const credentials = loadCredentials();
      els.appIdInput.value = credentials.appId;
      els.appSecretInput.value = credentials.appSecret;
      initEventListeners();
      prepareCourse();
      buildList();
      buildProgress();
      updateButtons();
      log("BUS", "凭据", "已载入本地 AppId / AppSecret 配置");
      log("BUS", "分句完成", `按句末标点切分为 ${COURSE.length} 句`, {
        segIds: COURSE.map((s) => s.id)
      });
      log("BUS", "Demo 就绪", "业务系统已注册数字人回调，SDK 不保存进度");
    });
  </script>
</body>
</html>
